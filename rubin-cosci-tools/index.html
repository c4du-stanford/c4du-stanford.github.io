<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubin co-scientist tools</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1c1b1f; --muted: #5c5a62; --box: #f1f0f3; --line: #dddbe2;
    --accent: #4f6a8a; --on-accent: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141318; --fg: #ebe9ef; --muted: #a6a3ad; --box: #1f1d25; --line: #34313c;
      --accent: #adc0d9; --on-accent: #141922;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141318; --fg: #ebe9ef; --muted: #a6a3ad; --box: #1f1d25; --line: #34313c;
    --accent: #adc0d9; --on-accent: #141922;
    color-scheme: dark;
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 2.5rem 16px 4rem; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 2rem; }
  h2 { font-size: 1.2rem; margin: 0 0 .5rem; }
  section { border-top: 1px solid var(--line); padding: 1.5rem 0; }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .download { display: inline-block; background: var(--accent); color: var(--on-accent); font-weight: 600;
              text-decoration: none; padding: .55rem 1.1rem; border-radius: 8px; margin: .25rem 0; }
  h3 { font-size: 1rem; margin: 1.25rem 0 .25rem; }
  p { margin: .4rem 0; }
  .line { display: flex; gap: 8px; align-items: stretch; margin: .5rem 0; }
  pre { flex: 1; min-width: 0; margin: 0; background: var(--box); border: 1px solid var(--line);
        border-radius: 8px; padding: .6rem .8rem; overflow-x: auto; }
  code { font: .92rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .copy { font: inherit; font-size: .9rem; padding: 0 .9rem; border-radius: 8px; cursor: pointer;
          border: 1px solid var(--line); background: var(--box); color: var(--fg); }
  .copy[hidden] { display: none; }
  .note { color: var(--muted); font-size: .93rem; }
</style>
</head>
<body>
<main>
<h1>Rubin co-scientist tools</h1>

<section aria-labelledby="lantern">
<h2 id="lantern"><a href="https://github.com/c4du-stanford/lantern-lab">Lantern</a></h2>
</section>

</main>
<script>
document.querySelectorAll("button.copy").forEach(function (b) {
  if (!navigator.clipboard) return;
  b.hidden = false;
  b.addEventListener("click", function () {
    var text = document.getElementById(b.getAttribute("data-copy")).textContent;
    navigator.clipboard.writeText(text).then(function () {
      b.textContent = "Copied";
      setTimeout(function () { b.textContent = "Copy"; }, 1500);
    });
  });
});
</script>
</body>
</html>
